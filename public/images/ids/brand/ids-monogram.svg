<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="idsBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B2799" />
      <stop offset="60%" stop-color="#2638CC" />
      <stop offset="100%" stop-color="#3D53E8" />
    </linearGradient>
    <linearGradient id="idsCoralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F06445" />
      <stop offset="100%" stop-color="#FF7B5E" />
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Shield / Tile -->
  <rect x="4" y="4" width="112" height="112" rx="26" fill="white" stroke="#E8E8E8" stroke-width="2" />
  
  <!-- Geometric IDS Monogram -->
  <g transform="translate(18, 26)">
    <!-- Letter 'I' (Column with precision cut) -->
    <rect x="0" y="6" width="14" height="56" rx="4" fill="url(#idsBlueGrad)" />
    <!-- Signature Coral Precision Dot above I -->
    <circle cx="7" cy="-2" r="5" fill="url(#idsCoralGrad)" />
    
    <!-- Letter 'D' (Curved architectural arc) -->
    <path d="M 24 6 H 42 C 55 6 64 16 64 34 C 64 52 55 62 42 62 H 24 V 6 Z M 38 48 C 45 48 50 42 50 34 C 50 26 45 20 38 20 H 36 V 48 H 38 Z" fill="url(#idsBlueGrad)" />
    
    <!-- Letter 'S' (Geometric ribbon flow) -->
    <path d="M 84 10 C 80 7 74 6 69 7 C 62 8 58 13 58 19 C 58 29 74 27 74 39 C 74 46 68 50 60 50 C 53 50 48 46 46 41 L 55 37 C 56 40 58 42 61 42 C 63 42 65 41 65 39 C 65 30 49 31 49 19 C 49 12 55 6 68 6 C 74 6 81 8 86 12 L 84 10 Z" fill="url(#idsBlueGrad)" transform="translate(16, 0)" />
  </g>
</svg>
