<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 64" fill="none">
  <defs>
    <linearGradient id="idsBlueGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B2799" />
      <stop offset="50%" stop-color="#2638CC" />
      <stop offset="100%" stop-color="#3D53E8" />
    </linearGradient>
    <linearGradient id="idsCoralGradL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F06445" />
      <stop offset="100%" stop-color="#FF7B5E" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EEF2FF" />
      <stop offset="100%" stop-color="#E0E7FF" />
    </linearGradient>
  </defs>

  <!-- Left Icon Emblem (Squircle tile with IDS brand geometry) -->
  <rect x="2" y="4" width="56" height="56" rx="16" fill="url(#badgeGrad)" stroke="#C7D2FE" stroke-width="1.5" />
  
  <!-- 4-Node Signature Grid with Blue & Coral Accent -->
  <g transform="translate(14, 16)">
    <!-- Node 1: Coral creative impulse -->
    <rect x="0" y="0" width="13" height="13" rx="4" fill="url(#idsCoralGradL)" />
    <!-- Node 2: Primary Brand Blue -->
    <rect x="18" y="0" width="13" height="13" rx="4" fill="url(#idsBlueGradL)" />
    <!-- Node 3: Deep Royal Blue -->
    <rect x="0" y="18" width="13" height="13" rx="4" fill="#1B2799" />
    <!-- Node 4: Dynamic Blue -->
    <circle cx="24.5" cy="24.5" r="6.5" fill="url(#idsBlueGradL)" />
  </g>

  <!-- Wordmark & Academy Tier -->
  <g transform="translate(74, 0)">
    <text x="0" y="32" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="20" font-weight="800" fill="url(#idsBlueGradL)" letter-spacing="-0.02em">
      International Design School
    </text>
    <text x="0" y="50" font-family="'Inter', -apple-system, monospace, sans-serif" font-size="10" font-weight="700" fill="#6B7CB0" letter-spacing="0.14em">
      GLOBAL CREATIVE ACADEMY &bull; PUNE
    </text>
  </g>
</svg>
